name: CI
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional tape test file(s)/glob to run instead of test/*'
        required: false
        default: ''
jobs:
  test:
    name: ${{ matrix.node-version }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macOS-latest, windows-latest, ubuntu-latest]
        node-version: [10, 12, 14]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          architecture: x64
      - name: Install
        run: npm i
      - name: Build browser bundles
        shell: bash
        run: |
          node node_modules/browserify/bin/cmd.js index.js -o dist/msgpack5.js -s msgpack5
          node node_modules/uglify-js/bin/uglifyjs dist/msgpack5.js -o dist/msgpack5.min.js
      - name: Tests
        shell: bash
        run: node node_modules/tape/bin/tape ${{ inputs.test-filter || 'test/*' }}
      - name: Pack
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 14
        run: npm pack
      - name: Upload package
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 14
        uses: actions/upload-artifact@v4
        with:
          name: msgpack5-tgz
          path: msgpack5-3.6.1.tgz
          if-no-files-found: error

  automerge:
    needs: test
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: fastify/github-action-merge-dependabot@v1
        if: ${{ github.actor == 'dependabot[bot]' && github.event_name == 'pull_request' }}
        with:
          github-token: ${{secrets.github_token}}
