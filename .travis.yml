language: node_js
node_js:
  - "0.12"
  - "4"
  - "6"
  - "7"
  - "8"
install:
  - npm install --ignore-scripts
before_script:
  - node node_modules/browserify/bin/cmd.js index.js -o dist/msgpack5.js -s msgpack5
  - node node_modules/uglify-js/bin/uglifyjs dist/msgpack5.js -o dist/msgpack5.min.js
script:
  - 'if [[ "$TRAVIS_NODE_VERSION" == 0.* ]]; then node node_modules/tape/bin/tape $(ls test/*.js | grep -v object-prototype-poisoning); else node node_modules/tape/bin/tape test/*; fi'
